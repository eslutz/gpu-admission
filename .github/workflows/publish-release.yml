name: Publish release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify version and matching CI artifacts
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'from xml.etree import ElementTree as ET; print(ET.parse("src/GpuAdmissionTray.csproj").findtext("./PropertyGroup/Version"))')
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo 'Set Version in src/GpuAdmissionTray.csproj to a value such as 0.2.0 or 0.2.0-preview.1.'
            exit 1
          fi
          tag="v$version"
          existing=$(git ls-remote --refs origin "refs/tags/$tag")
          if [[ -n "$existing" ]]; then
            if [[ "${existing%%$'\t'*}" != "$GITHUB_SHA" ]] || gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Version $version is already in use. Set a new project version."
              exit 1
            fi
            echo "The matching tag already exists. Continuing a previous publication attempt."
          fi
          security=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow codeql.yml --branch main --event push --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [[ ! "$security" =~ ^[0-9]+$ ]]; then
            echo "Wait for successful CodeQL checks for $GITHUB_SHA on main."
            exit 1
          fi
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow windows-release.yml --branch main --event push --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [[ ! "$run" =~ ^[0-9]+$ ]]; then
            echo "Wait for a successful Windows installer CI run for $GITHUB_SHA on main."
            exit 1
          fi
          gh run download "$run" --repo "$GITHUB_REPOSITORY" --name gpu-admission-windows-x64 --dir release
          cd release
          sha256sum --check --strict checksum-SHA256.txt
          {
            echo "tag=$tag"
            echo "run=$run"
          } >> "$GITHUB_OUTPUT"
          kind=release
          if [[ "$tag" == *-* ]]; then kind=prerelease; fi
          echo "Verified installer and checksum for $tag ($kind) at $GITHUB_SHA from CI run $run." >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Publish installer and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          BUILD_RUN: ${{ needs.prepare.outputs.run }}
        run: |
          set -euo pipefail
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name gpu-admission-windows-x64 --dir release
          cd release
          sha256sum --check --strict checksum-SHA256.txt
          existing=$(git ls-remote --refs "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$RELEASE_TAG")
          if [[ -z "$existing" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA" --silent
          elif [[ "${existing%%$'\t'*}" != "$GITHUB_SHA" ]]; then
            echo "The tag points to a different commit."
            exit 1
          fi
          release_flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "GPU Admission $RELEASE_TAG" \
            "${release_flags[@]}" --generate-notes \
            --notes 'Use checksum-SHA256.txt to verify the Windows installer. The built-in Source code (zip) and Source code (tar.gz) downloads contain the corresponding GPLv3 source from this release tag.' \
            'GPU-Admission-Setup-x64.exe#Windows x64 installer' \
            checksum-SHA256.txt
