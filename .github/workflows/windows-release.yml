name: Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test guard and publish Windows x64 app
        shell: pwsh
        run: |
          & ./src/Test-GuardLifecycle.ps1
          dotnet publish src/GpuAdmissionTray.csproj -c Release -r win-x64 --self-contained true -o out
      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0-dev' }
          & $compiler "/DAppVersion=$version" installer/GpuAdmission.iss
      - name: Write installer checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/GPU-Admission-Setup-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  GPU-Admission-Setup-x64.exe" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: gpu-admission-windows-x64
          path: |
            dist/GPU-Admission-Setup-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
