name: Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test guard and publish Windows x64 app
        shell: pwsh
        run: |
          powershell.exe -NoProfile -File src/Test-GuardLifecycle.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet publish src/GpuAdmissionTray.csproj -c Release -r win-x64 --self-contained true -o out
      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0-dev' }
          & $compiler "/DAppVersion=$version" installer/GpuAdmission.iss
      - uses: actions/upload-artifact@v4
        with:
          name: gpu-admission-windows-x64
          path: dist/GPU-Admission-Setup-x64.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gpu-admission-windows-x64
      - name: Publish installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum GPU-Admission-Setup-x64.exe > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" GPU-Admission-Setup-x64.exe SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
